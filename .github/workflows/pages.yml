name: Pubblica Orario Lezioni Nightfall

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il sito dal repository
        uses: actions/checkout@v4

      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara la pubblicazione
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
